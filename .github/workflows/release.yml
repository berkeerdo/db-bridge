name: Release

on:
  # Manual-only for now: auto tag-triggering was firing failed OIDC runs.
  # Re-enable tag triggers once trusted publishing is confirmed working.
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm OIDC trusted publishing (tokenless publish)
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  publish-npm:
    name: Publish to NPM (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN, whose
      # placeholder value shadows OIDC and causes 403. OIDC needs no token.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # OIDC trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      # Publish each package with npm directly (npm's native OIDC path is the
      # reference implementation; lerna 9's OIDC exchange is unreliable).
      # --ignore-scripts: dist is already built above; avoids prepublishOnly
      # re-cleaning it. Order: core first (others depend on it at install time).
      - name: Publish packages (OIDC, tokenless)
        run: |
          set -e
          echo "npm version: $(npm --version)"
          for pkg in core mysql postgresql redis db-bridge; do
            echo "::group::publish packages/$pkg"
            (cd "packages/$pkg" && npm publish --access public --ignore-scripts --loglevel verbose) || {
              echo "=== npm debug log (server response) ==="
              cat "$HOME"/.npm/_logs/*-debug-0.log | tail -60
              exit 1
            }
            echo "::endgroup::"
          done
