name: Release

on:
  workflow_dispatch:
  push:
    tags:
      # lerna independent tags (e.g. @db-bridge/core@1.2.1) and umbrella v-tags
      - '*@*'
      - 'v*'

permissions:
  contents: write
  # Required for npm OIDC trusted publishing (tokenless publish)
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  publish-npm:
    name: Publish to NPM (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc expecting NODE_AUTH_TOKEN, whose
      # placeholder value shadows OIDC and causes 403. OIDC needs no token.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # OIDC trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC id-token for a
      # short-lived publish credential via the package Trusted Publisher config
      - name: Publish packages (OIDC, tokenless)
        run: npx lerna publish from-package --yes --no-verify-access
